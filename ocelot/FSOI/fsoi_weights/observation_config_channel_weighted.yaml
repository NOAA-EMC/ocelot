          - -120
          - 50
          qm_flag_col: dewPointTemperatureQuality
          reject:
          - 13
          - 14
          - 15
        windSpeed:
          range:
          - 0
          - 150
          qm_flag_col: windQuality
          keep:
          - 2
        windDirection:
          range:
          - 0
          - 6.2832
          qm_flag_col: windQuality
          keep:
          - 2
