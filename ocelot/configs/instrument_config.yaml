  # Conventional instruments
  surface_obs:
    kind: conventional
    weight: 1.0
    source: zarr
    zarr_name: raw_surface_obs
    metadata: [height_prepbufr_event_1]
    model:
      encoder_hidden_layers: 2
      decoder_hidden_layers: 2
    qc_filters:
      pressureMeanSeaLevel_prepbufr:
        units: hPa
        range: [800, 1100]  # hPa; physically reasonable sea-level pressure range
      airTemperature:
        units: degC
        range: [-90, 60]  # Celsius; physically reasonable surface temperature range
        qm_flag_col: airTemperatureQuality_event_1
        keep: [0, 1, 2, 4, 9]
      dewPointTemperature:
        units: degC
        range: [-100, 50]  # Celsius; physically reasonable (Td <= T, can be very dry)
        qm_flag_col: dewPointTemperatureQuality_event_1
        keep: [1, 2, 4, 9]
      windSpeed:
        units: m/s
        range: [0, 150]  # m/s; physically reasonable (hurricanes ~90 m/s, allow margin)
      windDirection:
        units: radians
        range: [0, 6.2832]  # radians; full circle 0-2*pi
      # Metadata QC
      height_prepbufr_event_1:
        units: m
        range: [-500, 9000]  # meters; clip mild errors, treat 9999+ as missing in code
        clip: true
        qm_flag_col: heightQuality_event_1
        keep: [1, 2]
        require_flag_column: true
    qc_relations:  # Cross-variable checks
      dewpoint_le_temp: true  # Td <= T (+0.5 C margin)
      max_temp_dewpoint_spread: 60  # C; invalid if T - Td > 60
      rh_from_td_consistency_pct: 25  # %pts; invalidate RH if |RH - RH*| > 25
    features:
      # Surface obs use sea-level pressure.
      - name: pressureMeanSeaLevel_prepbufr
        weight: 1.0
        units: hPa
        normalization: {mean: 1014.39, std: 13.63}  # hPa
      - name: airTemperature
        weight: 1.0
        units: degC
        normalization: {mean: 13.99, std: 12.14}  # Celsius; 2020-2024: 545M valid samples (87.2% pass QC)
      - name: dewPointTemperature
        weight: 1.0
        units: degC
        normalization: {mean: 7.94, std: 11.47}  # Celsius; 2020-2024: 485M valid samples (77.7% pass QC)
      - name: wind_u
        weight: 1.0
        units: m/s
        normalization: {mean: 0.03, std: 3.30}  # m/s (u-component, computed from windSpeed/windDirection)
      - name: wind_v
        weight: 1.0
        units: m/s
        normalization: {mean: -0.03, std: 3.37}  # m/s (v-component, computed from windSpeed/windDirection)

  radiosonde:
    kind: conventional
    weight: 1.0
    source: zarr
    zarr_name: raw_radiosonde
    add_pressure_level_embed_dim: true
    metadata: [log_pressure_height]  # Derived from airPressure: z = -8000 * ln(P/1013.25)
    model:
      encoder_hidden_layers: 2
      decoder_hidden_layers: 2
    level_selection:
      filter_col: airPressure
      matching_mode: all  # Use ALL pressure levels (no filtering)
    qc_filters:
      # Keep airPressure QC to filter bad pressure values (needed for log_pressure_height)
      airPressure:
        units: hPa
        range: [1, 1100]  # hPa; physically reasonable (surface to high altitude)
        qm_flag_col: airPressureQuality
        keep: [0, 1, 2]
      airTemperature:
        units: degC
        range: [-90, 50]  # Celsius; physically reasonable atmospheric range
        qm_flag_col: airTemperatureQuality
        reject: [13, 14, 15]  # Reject bad flags
      dewPointTemperature:
        units: degC
        range: [-120, 50]  # Celsius; physically reasonable (very dry stratosphere to humid surface)
        qm_flag_col: dewPointTemperatureQuality
        reject: [13, 14, 15]  # Reject bad flags
      windSpeed:
        units: m/s
        range: [0, 150]  # m/s; physically reasonable (jet stream can exceed 100 m/s)
        qm_flag_col: windQuality
        keep: [2]  # Keep only good flag 2
      windDirection:
        units: radians
        range: [0, 6.2832]  # radians; full circle 0-2*pi
        qm_flag_col: windQuality
        keep: [2]  # Keep only good flag 2
    auxiliary_variables:
      airPressure:
        units: hPa
        normalization: {mean: 319.23, std: 296.08}  # Used to derive log_pressure_height
    features:
      # airPressure is a vertical coordinate, not a prediction feature.
      - name: airTemperature
        weight: 1.0
        units: degC
        normalization: {mean: -32.49, std: 28.82}  # Celsius (as stored in zarr); 2020-2024: ~54% pass QC
      - name: dewPointTemperature
        weight: 1.0
        units: degC
        normalization: {mean: -47.40, std: 34.48}  # Celsius (as stored in zarr); 2020-2024: ~52% pass QC
      - name: wind_u
        weight: 1.0
        units: m/s
        normalization: {mean: 4.95, std: 13.71}  # m/s (computed from windSpeed/windDirection); 2020-2024: ~60% pass QC
      - name: wind_v
        weight: 1.0
        units: m/s
        normalization: {mean: -0.31, std: 8.13}  # m/s (computed from windSpeed/windDirection); 2020-2024: ~60% pass QC

  aircraft:
    kind: conventional
    weight: 1.0
    source: zarr
    zarr_name: aircraft
    add_pressure_level_embed_dim: true
    metadata: [log_pressure_height]  # Derived from airPressure: z = -8000 * ln(P/1013.25)
    model:
      encoder_hidden_layers: 2
      decoder_hidden_layers: 2
    qc_filters:
      # QC filters based on physical reasonableness
      airPressure:
        units: hPa
        range: [100, 1100]  # hPa; physically reasonable for aircraft altitude range
        qm_flag_col: airPressureQuality
        keep: [0, 1, 2]
      airTemperature:
        units: degC
        range: [-90, 50]  # Celsius; physically reasonable for atmospheric temperature
        qm_flag_col: airTemperatureQuality
        keep: [0, 1, 2]
      windU:
        units: m/s
        range: [-150, 150]  # m/s; physically reasonable bound (rare extremes can exceed 100 m/s)
        qm_flag_col: windQuality
        keep: [0, 1, 2]
      windV:
        units: m/s
        range: [-150, 150]  # m/s; physically reasonable bound (rare extremes can exceed 100 m/s)
        qm_flag_col: windQuality
        keep: [0, 1, 2]
    auxiliary_variables:
      airPressure:
        units: hPa
        normalization: {mean: 505.53, std: 274.24}  # Used to derive log_pressure_height
    features:
      # airPressure is a vertical coordinate, not a prediction feature.
      - name: airTemperature
        weight: 1.0
        units: degC
        normalization: {mean: -18.56, std: 27.68}  # Celsius; 2020-2024: ~91% pass QC (flags 0,1,2)
      - name: windU
        weight: 1.0
        units: m/s
        normalization: {mean: 11.28, std: 15.43}  # m/s; 2020-2024: ~92% pass QC (flags 0,1,2)
      - name: windV
        weight: 1.0
        units: m/s
        normalization: {mean: 0.27, std: 11.46}  # m/s; 2020-2024: ~92% pass QC (flags 0,1,2)
