        range: [-55.0, 5.0]
        qm_flag_col: ascatSigma0Usability_ch_2
        keep: [0]
      backscatter_ch_3:
        units: dB
        range: [-55.0, 3.2]
        qm_flag_col: ascatSigma0Usability_ch_3
        keep: [0]
      radarIncidenceAngle_ch_1:
        units: degrees
        range: [20.0, 70.0]
        clip: true
      radarIncidenceAngle_ch_2:
        units: degrees
        range: [20.0, 70.0]
        clip: true
      radarIncidenceAngle_ch_3:
        units: degrees
        range: [20.0, 70.0]
        clip: true
      antennaBeamAzimuthAngle_ch_1:
        units: degrees
        range: [0.0, 360.0]
        clip: true
      antennaBeamAzimuthAngle_ch_2:
        units: degrees
        range: [0.0, 360.0]
        clip: true
      antennaBeamAzimuthAngle_ch_3:
        units: degrees
        range: [0.0, 360.0]
        clip: true
    features:
