hidden_dim: 192

mesh:
  type: fixed  # fixed | hierarchical
  resolution: 6
  levels: 4

encoder:
  type: gat # gat | interaction
  layers: 2
  heads: 4
  dropout: 0.0

processor:
  type: sliding_transformer  # sliding_transformer | interaction | hierarchical | hierarchical_transformer
  num_layers: 10
  depth: 4
  heads: 4
  window: 4
  dropout: 0.1

decoder:
  type: gat
  layers: 2
  heads: 4
  dropout: 0.0

embeddings:
  scan_angle_dim: 8
  pressure_level_dim: 8
  target_time_dim: 8
  num_pressure_levels: 16
