experiment_name: baseline_v1
checkpoint_dir: checkpoints/baseline_v1

data:
  window_hours: 12
  latent_step_hours: 3
  max_rollout_steps: 1
  zarr_root: /scratch3/NCEPDEV/da/Azadeh.Gholoubi/zarr

training:
  lr: 1.0e-4
  weight_decay: 1.0e-5
  max_epochs: 200
  precision: 16-mixed
  devices: 4

loss:
  type: mse                 # mse | huber
  huber_delta: 0.1

schedule:
  type: plateau             # plateau | cosine_warmup
  warmup_pct: 0.05
  min_lr: 1.0e-6
