# Verification-time quality control for the AIES revision (--verify_qc).
# Applied ONLY to the verifying observations when scoring (revision_metrics.py, baseline_table.py,
# and, with the range option, build_obs_climatology.py). The model, its inputs and its forecasts
# are exactly those of OCELOT v1, so results shown in the original figures do not change.

satellite:
  # Brightness temperatures outside the physical range are not observations (fill or corrupt
  # values) and are excluded. ASCAT backscatter is in dB and is exempt.
  value_range: [50, 400]          # K
  range_exclude: [ascat]
  outlier_k: 0                    # optional robust gross-error check; 0 = off

conventional:
  radiosonde:
    dewPointTemperature:
      min_pressure_hpa: 300       # humidity sensors are unreliable above 300 hPa
      le_variable: airTemperature # dew point cannot exceed air temperature (+0.5 C margin)
      le_margin: 0.5
      max_spread: 60              # C; reject if T - Td > 60
      # Rejecting quality mark 9 additionally needs the qm_* flag columns in the prediction CSVs
      # (export_flag_cols is set in the observation config; regenerate the predictions, then uncomment):
      # flag: dewPointTemperatureQuality
      # reject: [9]
  # Surface rules (quality mark 2 only) are intentionally not applied: surface T2m and 10-m wind
  # results appear in the original figures and must stay comparable. To restrict surface dew point
  # and MSLP only, regenerate the predictions with flags and add, e.g.:
  # surface_obs:
  #   dewPointTemperature: {flag: dewPointTemperatureQuality_event_1, keep: [2]}
