# Optional scoring-time checks for revision_metrics.py / baseline_table.py (--verify_qc).
#
# Observation QC itself lives in the data pipeline (configs/observation_config.yaml):
# satellite value ranges, radiosonde quality marks and dew-point pressure cutoff, surface
# quality marks, and cross-variable checks. Predictions made with that config already carry
# the QC in their mask_* columns, so this file is normally NOT needed.
#
# It remains for an optional robust gross-error check on satellite observations:
# reject an observation whose departure from the training-period climatology differs from the
# median departure by more than outlier_k robust standard deviations (1.4826 x MAD), per channel
# and initialization. 0 disables it. Note that for infrared window channels such a check can
# also remove real extremes (e.g. cold deep-convective cloud tops).
satellite:
  value_range: [50, 400]          # K (already enforced by the pipeline)
  range_exclude: [ascat]
  outlier_k: 0
