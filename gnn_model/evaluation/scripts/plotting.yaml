# =============================================================================
# OCELOT evaluation plotting configuration
# =============================================================================
# Every key here can be overridden on the command line, e.g.
#   python evaluations.py --config plotting.yaml --instruments atms --max-files 20
#
# Anything set to `null` means "auto" / "no filter".
# =============================================================================

io:
  # Prefix applied to any relative data_dir / plot_dir below. Absolute paths in
  # those keys are used as-is and ignore base_dir. null falls back to the
  # directory the run was launched from.
  # [recommended] base_dir: /PATH/TO/ocelot/gnn_model
  base_dir: null

  # Root to search, relative to <base_dir>. May be a single directory or a list.
  # Directories named obs-space-ar<N> anywhere under this root have their AR
  # step parsed automatically from the directory name.
  data_dir: val_csv/test1
  plot_dir: evaluation/figures/test1/val_obs

  # auto  -> detect per file by looking for true_* columns in the header
  # true  -> force comparison plots
  # false -> force prediction-only plots
  has_ground_truth: auto

  # AR rollout steps are read from the directory name. By default these
  # patterns are searched, anywhere under data_dir:
  #   data_dir/obs-space-ar<N>
  #   data_dir/mesh-grid-ar<N>
  #   data_dir/ar<N>
  # If your layout differs, list your own regexes here. Each must match a whole
  # directory name and capture the step number. Order does not matter: the
  # match is against the full name, so 'ar(\d+)' cannot match 'obs-space-ar3'.
  ar_dir_patterns: null
  # ar_dir_patterns: ['obs-space-ar(\d+)', 'mesh-grid-ar(\d+)', 'ar(\d+)']


# -----------------------------------------------------------------------------
# Which files to process
# -----------------------------------------------------------------------------
select:
  # Selector grammar, shared by dates / epochs / batches / fhrs / ar_steps:
  #   null                    -> no filter
  #   2025030100              -> exactly this one
  #   [a, b, c]               -> a LIST of exact values
  #   {range: [a, b]}         -> inclusive range
  # A bare list is always a list, so [12, 120] means those two and not the 109
  # in between. Ranges must say so.
  #   dates: {range: [2025030100, 2025030512]}
  dates: 2024110500
  date_step_hours: 12

  # Same grammar as dates, plus "latest", which keeps only the highest epoch
  # per instrument/init/fhr/batch -- what you usually want against a mesh dump
  # holding hundreds of epochs.
  #   epochs: 300
  #   epochs: [12, 120]           # exactly these two
  #   epochs: {range: [300, 350]}
  #   epochs: latest
  epochs: latest
  batches: null       # same grammar as dates
  fhrs: null          # mesh-grid forecast hours from the filename, same grammar
  ar_steps: null      # same grammar; null takes every AR step found

  # Safety valve. null = no cap.
  max_files: null
  max_files_per_instrument: 8


# -----------------------------------------------------------------------------
# Which instruments, and which channels within them
# -----------------------------------------------------------------------------
instruments:
  # null / omitted -> every instrument in the registry that has files
  # e.g., [atms, surface_obs, radiosonde]
  enabled: null

  # Per-instrument channel or parameter subset. null = all.
  # Satellites accept channel numbers (1-based) or full feature names.
  # Point instruments accept parameter names.
  channels:
    atms: null           # channel numbers or full feature names e.g., [1, 3, 9]
    surface_obs: null    # e.g. [airTemperature, wind_u]

  # ---------------------------------------------------------------------------
  # Instrument registry. This is the whole instrument table -- there is no copy
  # in evaluations.py. Adding an instrument is one line here.
  #
  # Fields (all optional except n_channels; unset ones fall back to `defaults`):
  #   n_channels           expected channel count when features cannot be
  #                        discovered from pred_* columns
  #   units                label for colorbars, e.g. K or dB. null for unitless
  #   error_metric         what panel 3 of the error_map figure shows:
  #                          absolute -> |pred - true|
  #                          percent  -> 100*(pred-true)/|true|, diverging
  #                          smape    -> 200|p-t|/(|p|+|t|)
  #                          auto     -> absolute for the features listed in
  #                                      features.auto_absolute, else smape
  #                        Has no effect on the diff figure, which is always
  #                        the signed pred - true.
  #   figures              which families to render: diff, error_map, profiles
  #   drop_small_truth     skip points where |true| < features.tiny_threshold
  #                        before computing percent / smape
  #   profile_min_samples  minimum obs per pressure level for profile plots
  # ---------------------------------------------------------------------------
  defaults:
    units: null
    error_metric: percent
    figures: [diff, error_map]
    drop_small_truth: false
    profile_min_samples: null

  registry:
    # brightness temperature / radiance sounders
    atms:        {n_channels: 22, units: K}
    amsua:       {n_channels: 15, units: K}
    ssmis:       {n_channels: 24, units: K}
    cris_pca:    {n_channels: 10}
    seviri_asr:  {n_channels: 8,  units: K}
    seviri_csr:  {n_channels: 8,  units: K}
    avhrr:       {n_channels: 3}

    # scatterometer
    ascat:       {n_channels: 3,  units: dB, error_metric: absolute}

    # conventional / point
    surface_obs: {n_channels: 6,  error_metric: auto, drop_small_truth: true}
    snow_cover:  {n_channels: 2,  error_metric: auto, drop_small_truth: true,
                  figures: [diff]}

    # profile instruments
    radiosonde:  {n_channels: 5,  error_metric: auto, drop_small_truth: true,
                  figures: [diff, error_map, profiles]}
    aircraft:    {n_channels: 4,  error_metric: auto, drop_small_truth: true,
                  figures: [diff, error_map, profiles],
                  profile_min_samples: 1000}


# -----------------------------------------------------------------------------
# Which figure families to produce
# -----------------------------------------------------------------------------
figures:
  diff: true              # OCELOT / Target / signed Difference
  error_map: true         # Ground Truth / Prediction / error metric
  profiles: true          # vertical profiles by pressure level
  pressure_levels: true   # per-level map subdirectories
  wind: true              # wind speed / direction diagnostics
  pred_only: auto         # auto -> only when a file has no ground truth
  ar_growth: true         # NEW: RMSE / bias vs lead hour across AR steps
  metrics_table: true     # NEW: metrics.csv of RMSE / MAE / bias per group


# -----------------------------------------------------------------------------
# Per-feature tuning tables
#
# These were previously hardcoded at the top of evaluations.py with no way to
# reach them. Keys are feature names as they appear in the pred_/true_ columns.
# -----------------------------------------------------------------------------
features:
  # Features that resolve to absolute error when an instrument's error_metric
  # is `auto`. Anything NOT listed here falls through to sMAPE -- which is how
  # airPressure ended up on sMAPE by omission rather than by choice.
  auto_absolute:
    - airTemperature
    - dewPointTemperature
    - relativeHumidity
    - wind_u
    - wind_v
    - windU
    - windV
    - specificHumidity

  # Minimum |truth| required before a point contributes to percent or sMAPE.
  # Only consulted when the instrument sets drop_small_truth: true. Guards the
  # division by a near-zero denominator; unlisted features use 0 (no drop).
  tiny_threshold:
    airTemperature: 2.0                  # degC
    dewPointTemperature: 2.0             # degC
    relativeHumidity: 5.0                # percentage points
    wind_u: 1.0                          # m/s
    wind_v: 1.0                          # m/s
    windU: 1.0                           # m/s
    windV: 1.0                           # m/s
    airPressure: 5.0                     # hPa
    pressureMeanSeaLevel_prepbufr: 5.0   # hPa

  # Wind direction is undefined in near-calm conditions, so points below this
  # speed are excluded from the wind_direction panels only.
  calm_wind_threshold: 2.0               # m/s

  # Physical plausibility ranges, applied to both truth and prediction. Points
  # outside are dropped as sentinel or fill values. Applies to surface_obs.
  qc_ranges:
    airTemperature: [-80.0, 60.0]
    dewPointTemperature: [-100.0, 40.0]
    relativeHumidity: [0.0, 100.0]
    airPressure: [300.0, 1200.0]
    pressureMeanSeaLevel_prepbufr: [300.0, 1200.0]
    wind_u: [-75.0, 75.0]
    wind_v: [-75.0, 75.0]


# -----------------------------------------------------------------------------
# Lead-time windowing
# -----------------------------------------------------------------------------
windows:
  # Per-lead maps: one figure per nominal lead, window (L - step, L]
  subwindows: true
  # auto = every lead present. Otherwise a list naming the END of each window,
  # since a window is (L - step, L]: [3, 9] gives 0-3h and 6-9h.
  subwindow_leads: auto

  # Aggregated maps across a contiguous block of leads
  horizons: true
  horizon_length_hours: 12
  # auto tiles the leads present into chunks of horizon_length_hours, so an
  # AR2 file with leads 27/30/33/36 yields a single 24-36h horizon.
  horizon_bounds: auto

  strict_obs_window: false  # raise instead of warn on out-of-window obs times


# -----------------------------------------------------------------------------
# Colour limits
# -----------------------------------------------------------------------------
limits:
  # auto   -> min/max over truth and prediction (previous behaviour)
  # robust -> percentile-based, ignores single outliers
  # fixed  -> use the explicit entries below, falling back to robust
  mode: robust
  robust_percentile: 99

  # Reuse one set of limits across every AR step of a run so that AR0 and AR3
  # maps are visually comparable. Costs one extra header pass over the files.
  share_across_ar_steps: true

  # Explicit overrides. Resolution order:
  #   <instrument>.<feature> -> <instrument> -> global default
  # Each entry is [min, max] for the value panels, and error: [min, max] for
  # the difference panel.
  fixed: {}
  # fixed:
  #   atms:
  #     value: [180, 300]
  #     error: [-5, 5]
  #   surface_obs:
  #     airTemperature:
  #       value: [-40, 50]


# -----------------------------------------------------------------------------
# Rendering
# -----------------------------------------------------------------------------
render:
  dpi: 150
  point_size: 7
  cmap_value: turbo
  cmap_diff: bwr
  cmap_error: jet
  min_points_per_level: 200
  profile_min_samples: 500
  jobs: 1            # >1 renders files in parallel worker processes
