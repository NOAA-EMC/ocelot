# FSOI Configuration - Aircraft Observations Impact Study
# Objective:
#   Measure how ALL observation types impact forecast error of AIRCRAFT
#   verification targets: temperature, specific humidity, u/v wind at
#   flight levels (pressure-stratified).
#
# Scientific notes:
# - Aircraft obs span the upper troposphere (~200-850 hPa); pressure
#   stratification is enabled to diagnose vertical structure of impact.
# - Area weighting is enabled for fair global comparison.
# - Aircraft humidity is NOT masked (aircraft is the verification target here).
#   Compare to radiosonde config where aircraft humidity is masked because
#   the model's aircraft q representation may be degraded.
# - Finite-difference check is enabled (10 samples).

forecast:
  lead_steps: [0]

  # Decode/score only aircraft verification targets
  target_instruments: ["aircraft"]

  # All aircraft channels: T, specific_humidity, u_wind, v_wind
  target_variables: "all"

  target_pressure_levels: "all"

  use_instrument_weights: false
  use_channel_weights: false

  # Area weighting: flights are concentrated over NH land/ocean corridors.
  use_area_weights: true

  loss_reduction: "mean"
  impact_factor: 0.5

  # Aircraft obs have pressure (altitude) levels → stratify to diagnose
  # which flight levels are most sensitive to each observation type.
  stratify_by_pressure: true

  # Separate backward pass per variable for T / q / u / v maps.
  stratify_by_variable: true

plots:
  save_scatter_samples: true
  scatter_max_points: 200000

data:
  start_date: "2025-06-01"
  end_date: "2025-06-30"

  batch_size: 1
  num_workers: 1

  output_dir: "./FSOI/fsoi_outputs/aircraft_impact"
  save_per_obs_impacts: false
  store_full_tensors: false

  # Do NOT mask aircraft humidity: aircraft is the verification target here.
  # (Contrast with radiosonde config where aircraft q is masked as an input.)
  feature_masks: {}

memory:
  max_decoder_nodes:
    avhrr: 30000
    atms: 50000
    amsua: 30000
    ssmis: 30000
    seviri_asr: 30000
    seviri_csr: 30000

model:
  checkpoint_path: "checkpoints/"

aggregation:
  by_instrument: true
  by_channel: true
  by_time: true
  by_region: false
  by_pressure_level: true

  regions:
    tropics:
      lat_range: [-30, 30]
    mid_latitudes_nh:
      lat_range: [30, 60]
    mid_latitudes_sh:
      lat_range: [-60, -30]
    polar_nh:
      lat_range: [60, 90]
    polar_sh:
      lat_range: [-90, -60]

validation:
  check_reproducibility: true
  check_gradients: true
  check_alignment: true

  require_instruments: null
  require_satellite: false

  finite_difference_check: true
  fd_num_samples: 10
  fd_epsilon: 1.0e-4
  require_fd_pass: false

  min_pairs_warning: 20
  verbose: true

output:
  save_csv: true
  save_zarr: false
  save_netcdf: false

experiment:
  name: "aircraft_impact"
  description: |
    FSOI analysis: how do all observation types impact forecast error scored
    at AIRCRAFT verification targets?
    Variables: temperature, specific_humidity, u_wind, v_wind.
    Pressure-stratified by flight level (~200-850 hPa).
    Area-weighted; aircraft humidity NOT masked (aircraft is the target).
