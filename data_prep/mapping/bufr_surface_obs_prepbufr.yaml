bufr:
  subsets:
    - ADPSFC
    - SFCSHP
  variables:
    stationIdentification_prepbufr:
      query: "*/SID"
        #type: string

    obsType:
      query: "*/TYP"

    observationSubTypeNum:
      query: "*/T29"

        #temperatureEventCode:
        #query: "*/T___INFO/T__EVENT/TPC"

    temperatureEventCode1:
      query: "*/T___INFO/T__EVENT{1}/TPC"

    temperatureEventCode2:
      query: "*/T___INFO/T__EVENT{2}/TPC"

    temperatureEventCode3:
      query: "*/T___INFO/T__EVENT{3}/TPC"

    specificHumidityEventCode:
      query: "*/Q___INFO/Q__EVENT/QPC"

    obsTimeMinusCycleTime:
      query: "*/DHR"

    prepbufrDataLevelCategory:
      query: "*/CAT"

    latitude:
      query: "*/YOB"

    longitude:
      query: "*/XOB"
      transforms:
        - wrap: [ -180.0, 180.0 ]

    height_prepbufr:
      query: "*/Z___INFO/Z__EVENT/ZOB"
      type: float

    stationElevation_prepbufr:
      query: "*/ELV"
      type: float

    pressureMeanSeaLevel_prepbufr:
      query: "*/PMSL_SEQ/PMO"

    airPressure_prepbufr:
      query: "*/P___INFO/P__EVENT{1-3}/POB"

    dewPointTemperature_prepbufr:
      query: "*/Q___INFO/TDO"

    eastwardWind:
      query: "*/W___INFO/W__EVENT/UOB"

    northwardWind:
      query: "*/W___INFO/W__EVENT/VOB"

    specificHumidity:
      query: "*/Q___INFO/Q__EVENT/QOB"
      type: float
      transforms:
        - scale: 0.000001    # convert g/kg to kg/kg

    # Quality Markers
    airTemperatureQuality:
      query: "*/T___INFO/T__EVENT/TQM"

    pressureMeanSeaLevelQuality:
      query: "*/PMSL_SEQ/PMQ" 

    specificHumidityQuality:
      query: "*/Q___INFO/Q__EVENT/QQM"

    dewPointTemperatureQuality:
      query: "*/Q___INFO/Q__EVENT/QQM"

    airPressureQuality:
      query: "*/P___INFO/P__EVENT{1-3}/PQM" # coarse dimension

    heightQuality:
      query: "*/Z___INFO/Z__EVENT/ZQM"

    windQuality:
      query: "*/W___INFO/W__EVENT/WQM"



encoder:
  variables:
    # MetaData
    - name: "stationIdentification_prepbufr"
      source: variables/stationIdentification_prepbufr
      longName: "stationIdentification"

    - name: "latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "prepbufrDataLevelCategory"
      source: variables/prepbufrDataLevelCategory
      longName: "prepbufrDataLevelCategory"

        #    - name: "temperatureEventCode"
        #source: variables/temperatureEventCode
        #longName: "temperature Event Code"

    - name: "temperatureEventCode1"
      source: variables/temperatureEventCode1
      longName: "temperature Event Code"

    - name: "temperatureEventCode2"
      source: variables/temperatureEventCode2
      longName: "temperature Event Code"

    - name: "temperatureEventCode3"
      source: variables/temperatureEventCode3
      longName: "temperature Event Code"

    - name: "specificHumidityEventCode"
      source: variables/specificHumidityEventCode
      longName: "Specific Humidity Event Code"

    - name: "height_prepbufr"
      source: variables/height_prepbufr
      longName: "height from prepbufr (ZOB)"
      units: "m"

    - name: "stationElevation_prepbufr"
      source: variables/stationElevation_prepbufr
      longName: "stationElevation from prepbufr (ELV)"
      units: "m"

    - name: "airPressure_prepbufr"
      source: variables/airPressure_prepbufr
      longName: "airPressure from pb (POB)"
      units: "hPa"

    - name: "pressureMeanSeaLevel_prepbufr"
      source: variables/pressureMeanSeaLevel_prepbufr
      longName: "pressureMeanSeaLevel from pb (PMO)"
      units: "hPa"

    - name: "dewPointTemperature_prepbufr"
      source: variables/dewPointTemperature_prepbufr
      longName: "dew point from pb"
      units: "C"

    - name: "airTemperatureQuality"
      source: variables/airTemperatureQuality
      longName: "Air Temperature Quality Marker"

    - name: "pressureMeanSeaLevelQuality"
      source: variables/pressureMeanSeaLevelQuality
      longName: "Pressure Mean Sea Level Quality Marker"

    - name: "specificHumidityQuality"
      source: variables/specificHumidityQuality
      longName: "Specific Humidity Quality Marker"

    - name: "dewPointTemperatureQuality"
      source: variables/dewPointTemperatureQuality
      longName: "Dew Point Temperature Quality Marker"

    - name: "windQuality"
      source: variables/windQuality
      longName: "Wind Quality Marker"

    - name: "airPressureQuality"
      source: variables/airPressureQuality
      longName: "Air Pressure Quality Marker"

    - name: "heightQuality"
      source: variables/heightQuality
      longName: "Height Quality Marker"

    - name: "obsType"
      source: variables/obsType
      longName: "ObsType"

    - name: "observationSubTypeNum"
      source: variables/observationSubTypeNum
      longName: "Observation SubType Number"
